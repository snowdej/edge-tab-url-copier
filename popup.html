<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab URL Copier</title>
  <style>
    body { font: 14px Segoe UI, sans-serif; width: 340px; margin: 14px; color: #1b1b1b; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 10px; color: #555; line-height: 1.4; }
    textarea { box-sizing: border-box; width: 100%; min-height: 125px; resize: vertical; font: 12px Consolas, monospace; }
    button { width: 100%; margin-top: 8px; padding: 8px; cursor: pointer; }
    label { display: block; margin-top: 9px; }
    #group-name { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 6px; }
    #status { min-height: 18px; margin-top: 8px; color: #333; }
  </style>
</head>
<body>
  <h1>Tab URL Copier</h1>
  <p>Paste one URL per line, then open them as tabs.</p>
  <textarea id="url-list" autofocus placeholder="https://example.com&#10;https://example.org"></textarea>
  <label><input type="checkbox" id="make-group"> Put these tabs in a new group</label>
  <input id="group-name" type="text" value="Pasted links" aria-label="New tab group name">
  <button id="open">Open pasted URLs</button>
  <button id="copy">Copy selected tabs or active group</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
